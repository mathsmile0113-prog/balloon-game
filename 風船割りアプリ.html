<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ふうせんわり</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            overflow: hidden; /* 画面外のスクロールを防ぐ */
            background-color: #f0fdf4; /* 優しい緑系の背景色 */
            touch-action: manipulation; /* ダブルタップズームなどを防ぐ */
        }

        .balloon-container {
            position: absolute;
            cursor: pointer;
            /* ふわふわ揺れるアニメーション */
            animation: float 3s ease-in-out infinite alternate;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .balloon {
            width: 100px;
            height: 120px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1), 3px 5px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        /* 風船の結び目 */
        .balloon::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 12px solid inherit; /* JSで色を合わせる */
        }

        /* ふわふわアニメーションのキーフレーム */
        @keyframes float {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-20px) rotate(3deg); }
        }

        /* 破裂時のパーティクル（破片） */
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none; /* クリックを邪魔しないようにする */
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">

    <!-- ヘッダーとスコア表示 -->
    <div class="absolute top-8 text-center z-10 w-full px-4">
        <h1 class="text-3xl md:text-4xl font-bold text-teal-600 mb-2 drop-shadow-sm">ふうせんを わろう！</h1>
        <p class="text-lg text-teal-800 bg-white/60 inline-block px-6 py-2 rounded-full shadow-sm backdrop-blur-sm">
            わったかず: <span id="score" class="font-bold text-2xl text-rose-500">0</span>
        </p>
    </div>

    <!-- 風船が表示されるメインエリア -->
    <div id="game-area" class="w-full h-full relative overflow-hidden">
        <!-- JSでここに風船が追加されます -->
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const scoreElement = document.getElementById('score');
        let score = 0;

        // 優しいパステルカラーのリスト
        const colors = [
            '#fca5a5', // 赤系 (Red 300)
            '#fdba74', // オレンジ系 (Orange 300)
            '#fcd34d', // 黄色系 (Amber 300)
            '#86efac', // 緑系 (Green 300)
            '#67e8f9', // 水色系 (Cyan 300)
            '#93c5fd', // 青系 (Blue 300)
            '#d8b4fe', // 紫系 (Purple 300)
            '#f9a8d4'  // ピンク系 (Pink 300)
        ];

        function createBalloon() {
            const container = document.createElement('div');
            container.className = 'balloon-container';

            const balloon = document.createElement('div');
            balloon.className = 'balloon';

            // ランダムな色を選択
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            balloon.style.backgroundColor = randomColor;
            // 結び目の色も合わせる（少し暗くするなどの工夫もできますが今回は同じ色で）
            container.style.borderBottomColor = randomColor; 

            // ランダムな位置（画面端に行き過ぎないように調整）
            const size = 120; // 風船のおおよそのサイズ
            const maxX = window.innerWidth - size;
            const maxY = window.innerHeight - size;
            
            // 下の方から現れてほしい場合はY座標を調整できますが、今回は画面内にランダムに配置
            const randomX = Math.max(20, Math.random() * maxX);
            const randomY = Math.max(150, Math.random() * (maxY - 150)); // ヘッダーを避ける

            container.style.left = `${randomX}px`;
            container.style.top = `${randomY}px`;

            container.appendChild(balloon);
            gameArea.appendChild(container);

            // クリック（タップ）イベント
            // touchstartも追加してスマホでの反応を良くします
            const popHandler = (e) => {
                e.preventDefault(); // デフォルトのタッチ動作を防ぐ
                popBalloon(container, randomColor, randomX + 50, randomY + 60);
            };
            
            container.addEventListener('mousedown', popHandler);
            container.addEventListener('touchstart', popHandler, { passive: false });
        }

        function popBalloon(element, color, x, y) {
            // 風船を消す
            element.remove();

            // スコアを増やす
            score++;
            scoreElement.innerText = score;
            
            // ちょっとしたアニメーションでスコアを強調
            scoreElement.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(1.5)' },
                { transform: 'scale(1)' }
            ], { duration: 300 });

            // パーティクル（破片）を生成
            createParticles(x, y, color);

            // 0.5秒〜1秒後に新しい風船を出す
            setTimeout(createBalloon, Math.random() * 500 + 500);
        }

        function createParticles(x, y, color) {
            const particleCount = 30; // 破片の数

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.backgroundColor = color;
                
                // クリックされた中心位置に配置
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                
                gameArea.appendChild(particle);

                // ランダムな方向と距離を計算
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 50; // 50px 〜 150px 飛ぶ
                
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                // Web Animations API でアニメーションさせる
                const animation = particle.animate([
                    { transform: `translate(-50%, -50%) scale(1)`, opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: Math.random() * 300 + 400, // 400ms 〜 700ms
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)', // 最初は速く、後からゆっくり
                });

                // アニメーションが終わったら要素を削除
                animation.onfinish = () => {
                    particle.remove();
                };
            }
        }

        // 最初の風船を生成
        window.onload = () => {
            createBalloon();
        };
    </script>
</body>
</html>
